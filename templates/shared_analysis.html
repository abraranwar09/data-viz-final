<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="analysis-id" content="{{ analysis.id }}">
    <meta name="share-id" content="{{ analysis.share_id }}">
    <title>{{ analysis.title }} - Shared Analysis</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-graph-up me-2"></i>Data Analysis Dashboard
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <i class="bi bi-house-door me-1"></i>Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/shared">
                                <i class="bi bi-share me-1"></i>Shared Analyses
                            </a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <div id="collaborators" class="me-3">
                            <div class="collaborator-list">
                                <!-- Active collaborators will be displayed here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Analysis Content -->
        <div class="row mt-4">
            <div class="col-md-9">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">{{ analysis.title }}</h5>
                        <small class="text-muted">
                            <i class="bi bi-eye me-1"></i>{{ analysis.views }} views
                        </small>
                    </div>
                    <div class="card-body">
                        {% if analysis.description %}
                        <p class="card-text">{{ analysis.description }}</p>
                        {% endif %}
                        
                        <!-- Data Preview Section -->
                        <div id="dataStats" class="mb-3"></div>
                        <div class="table-responsive">
                            <table class="table table-hover" id="previewTable"></table>
                        </div>
                    </div>
                </div>

                <!-- Visualizations -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Visualizations</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <div id="chart1" class="chart-container"></div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div id="chart2" class="chart-container"></div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div id="chart3" class="chart-container"></div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div id="chart4" class="chart-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Comments Section -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-chat-dots me-2"></i>Discussion
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="commentsList" class="comments-container mb-3"></div>
                        <div class="comment-form">
                            <div class="mb-3">
                                <label for="commentContent" class="form-label">Add a comment</label>
                                <textarea class="form-control" id="commentContent" rows="3" 
                                          placeholder="Share your thoughts..."></textarea>
                            </div>
                            <button class="btn btn-primary w-100" id="submitComment">
                                <i class="bi bi-send me-1"></i>Post Comment
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/dataProcessor.js"></script>
    <script src="/static/js/visualizations.js"></script>
    <script src="/static/js/collaboration.js"></script>
    <script>
        // Initialize analysis data
        document.addEventListener('DOMContentLoaded', () => {
            const analysisData = {{ analysis.data | tojson | safe }};
            updateDataStats(analysisData);
            updatePreviewTable(analysisData.preview);
            updateVisualizations(analysisData);
        });
    </script>
</body>
</html>
